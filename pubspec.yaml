name: runners_journey
description: A runner's life diary - races pinned on an illustrated map of South Africa.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  intl: ^0.19.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map/base.jpg
    - assets/map/tiles/2/
    - assets/map/tiles/3/
    - assets/map/cape/4/
    - assets/map/cape/5/
    - assets/map/cape/6/
