name: runners_journey
description: A runner's life diary - races pinned on an illustrated map of South Africa.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  intl: ^0.19.0
  image_picker: ^1.1.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  http: ^1.2.0
  purchases_flutter: ^8.2.0
  share_plus: ^10.1.4
  shared_preferences: ^2.3.0
  sentry_flutter: ^8.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#0A2466"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
